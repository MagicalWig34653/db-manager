name: Echter Web-Datenbank-Pfad
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Öffentlichen Quellstand abrufen
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git init --initial-branch=ci .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          if [ -n "$PR_NUMBER" ]; then
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "$COMMIT"
          fi
          git checkout --detach FETCH_HEAD
      - name: Go einrichten
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Browserwerkzeuge einrichten
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.5.0'
      - name: Gepinnte Assets und beide Verträge offline prüfen
        run: |
          python3 scripts/build-web.py --check
          python3 -B scripts/test-build-web.py
      - name: Öffentliche freigegebene Webquelle reproduzieren
        run: |
          python3 scripts/build-web.py
          git diff --exit-code -- internal/webui/static internal/webui/assets-manifest.json
      - name: CLI, Compose, Chromium, SQLite und PostgreSQL mit TLS prüfen
        run: python3 scripts/test-web-integration.py --browser-deps
