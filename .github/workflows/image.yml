name: Container-Image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/magicalwig34653/db-manager
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - name: Öffentlichen Quellstand abrufen
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git init --initial-branch=ci .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          if [ -n "$PR_NUMBER" ]; then
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "$COMMIT"
          fi
          git checkout --detach FETCH_HEAD
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Bei ghcr.io anmelden (nur Push-Ereignisse)
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags und OCI-Labels bestimmen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/MagicalWig34653/db-manager
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Image bauen und bei Push-Ereignissen veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
