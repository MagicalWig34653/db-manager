name: Pages – Build und freigegebene Veröffentlichung

on:
  pull_request:
    paths: ['site/**', 'docs/**', 'contracts/**', 'README.md', 'EINRICHTUNG.md', 'LICENSE', '.github/workflows/pages.yml']
  push:
    paths: ['site/**', 'docs/**', 'contracts/**', 'README.md', 'EINRICHTUNG.md', 'LICENSE', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Nach unabhängiger QA und Releasefreigabe auf Pages veröffentlichen'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.5.0'
      - name: Install locked build dependencies
        run: |
          python -m venv site/.venv
          site/.venv/bin/python -m pip install --only-binary=:all: --require-hashes -r site/requirements.lock
          npm ci --prefix site --ignore-scripts --no-audit --no-fund
      - name: Build canonical documentation and check every local link
        run: |
          site/.venv/bin/python site/check-dependencies.py
          site/.venv/bin/python site/tests/build_sources.py
          site/.venv/bin/python site/build.py
          site/.venv/bin/python site/check.py
      - name: Browser, responsive layout and accessibility
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/dist/db-manager
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish approved main artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
