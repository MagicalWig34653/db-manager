# SPDX-License-Identifier: AGPL-3.0-only
name: SQL-Werkzeuge (vorläufig API 0.16)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Öffentlichen Quellstand abrufen
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Go einrichten
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Backend, Parser und Vertrag prüfen
        run: |
          test -z "$(gofmt -l internal/core/sqlbatch.go internal/database/sqlbatch*.go internal/httpapi/sqlbatch*.go internal/sqlsplit)"
          go vet ./...
          go test -race -count=1 ./...
          go test ./internal/sqlsplit -run '^$' -fuzz FuzzSplit -fuzztime=10s -parallel=2
          python3 scripts/check-sqlbatch-contract.py
          python3 scripts/check-docs.py
      - name: Echte vier Datenbanksysteme prüfen
        run: python3 scripts/test-sqlbatch.py
