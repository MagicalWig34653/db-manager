services:
  app:
    image: ${DBM_IMAGE:-db-manager:local}
    build: .
    ports:
      - "127.0.0.1:${DBM_PORT:-8080}:8080"
    environment:
      DBM_ALLOWED_HOSTS: ${DBM_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      DBM_DB_CA_FILE: ${DBM_DB_CA_FILE:-}
    secrets:
      - api_token
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
secrets:
  api_token:
    file: ${DBM_TOKEN_PATH:-./secrets/api_token}
volumes:
  data:
