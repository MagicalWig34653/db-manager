# Optional addition after swarm.state.yaml carrying the separate DDL account.
# Standard: run `db-manager state-migrate` as a one-shot job/init step and deploy the
# long-running service WITHOUT this file. Exception: deploying the service with this
# file makes it migrate at start and keeps the DDL password in the container.
# See docs/BETRIEB.md; a Swarm one-shot job is not provided or tested here.
version: "3.8"
services:
  app:
    environment:
      DBM_STATE_DB_MIGRATE_USER: ${DBM_STATE_DB_MIGRATE_USER:-dbmanager_migrate}
      DBM_STATE_DB_MIGRATE_PASSWORD_FILE: /run/secrets/state_db_migrate_password
    secrets:
      - state_db_migrate_password
secrets:
  state_db_migrate_password:
    external: true
    name: ${DBM_STATE_DB_MIGRATE_PASSWORD_SECRET:-dbmanager_state_db_migrate_password_v1}
