# Optional external MariaDB for the server state: see deploy/swarm.state.yaml and docs/BETRIEB.md.
version: "3.8"
services:
  app:
    image: ${DBM_IMAGE:-ghcr.io/magicalwig34653/db-manager:latest}
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    environment:
      DBM_ALLOWED_HOSTS: ${DBM_ALLOWED_HOSTS:-localhost,127.0.0.1,::1}
      DBM_DB_CA_FILE: ${DBM_DB_CA_FILE:-}
    secrets:
      - api_token
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    stop_grace_period: 15s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.dbmanager.data == true
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
secrets:
  api_token:
    external: true
    name: ${DBM_TOKEN_SECRET:-dbmanager_api_token_v1}
volumes:
  # Node-local volume (driver local): no NFS/Gluster/Ceph/cloud volume plugin is needed.
  # The service is pinned by the placement constraint above to the single node labelled
  # dbmanager.data=true; there is no failover or replication of /data between nodes.
  data:
    driver: local
