# Optional addition to compose.state.yaml carrying the separate DDL account.
# Standard use: run the one-shot job, then start the service WITHOUT this file:
#
#   docker compose -f compose.yaml -f compose.state.yaml -f compose.state-migrate.yaml \
#     run --rm --no-deps app state-migrate
#
# Exception: adding this file to `up -d` makes the running service migrate at start
# (under a database lock, so replicas migrate exactly once), which keeps the DDL
# password inside the long-running container. See docs/BETRIEB.md.
services:
  app:
    environment:
      DBM_STATE_DB_MIGRATE_USER: ${DBM_STATE_DB_MIGRATE_USER:-dbmanager_migrate}
      DBM_STATE_DB_MIGRATE_PASSWORD_FILE: /run/secrets/state_db_migrate_password
    secrets:
      - state_db_migrate_password
secrets:
  state_db_migrate_password:
    file: ${DBM_STATE_DB_MIGRATE_PASSWORD_PATH:-./secrets/state_db_migrate_password}
